<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thief and Police - Anti-Gravity Edition</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="particles-background"></div>

    <div class="container">
        <!-- Landing Screen -->
        <section id="landing-screen" class="screen active">
            <h1 class="glow-text title">THIEF & POLICE</h1>
            <div class="glass-panel">
                <input type="text" id="player-name" placeholder="Enter your name" class="glass-input" maxlength="15">
                
                <div class="action-buttons">
                    <button id="btn-create-room" class="btn primary-btn glow-btn">Create Room</button>
                    
                    <div class="divider"><span>OR</span></div>
                    
                    <input type="text" id="room-code-input" placeholder="Room Code (e.g. A1B2C)" class="glass-input small uppercase-input" maxlength="5">
                    <button id="btn-join-room" class="btn secondary-btn">Join Game</button>
                </div>
            </div>
            
            <div id="available-rooms-container" class="glass-panel hidden" style="margin-top: 20px;">
                <h3 style="margin-top:0; text-align:center; color: #a5b4fc;">Available Rooms</h3>
                <ul id="available-rooms-list" class="rooms-list" style="list-style: none; padding: 0; margin: 0;"></ul>
            </div>
        </section>

        <!-- Lobby Screen -->
        <section id="lobby-screen" class="screen">
            <h2 class="glow-text subtitle">LOBBY</h2>
            <div class="room-code-display">
                <span>Room Code:</span>
                <span id="display-room-code" class="glow-text">XXXXX</span>
            </div>
            
            <div class="glass-panel flex-panel">
                <div class="players-list-container">
                    <h3>Players Connected (<span id="player-count">0</span>)</h3>
                    <ul id="lobby-players-list" class="players-list">
                        <!-- Players will be added here via JS -->
                    </ul>
                </div>
                
                <div class="lobby-controls">
                    <p id="waiting-msg" class="info-text">Waiting for host to start...</p>
                    <button id="btn-start-game" class="btn primary-btn glow-btn hidden">Start Game</button>
                </div>
            </div>
        </section>

        <!-- Game Screen -->
        <section id="game-screen" class="screen">
            <div class="game-layout">
                <div class="game-table-column">
                    <div id="table-container">
                        <!-- Center Deck -->
                        <div id="deck-area">
                            <div class="deck-card face-down"></div>
                            <div class="deck-card face-down deck-offset-1"></div>
                            <div class="deck-card face-down deck-offset-2"></div>
                        </div>
                        
                        <!-- Action Banner -->
                        <div id="action-banner" class="hidden">
                            <h2 class="glow-text">CATCH THE THIEF!</h2>
                        </div>
                        
                        <button id="btn-in-game-finish" class="btn primary-btn glow-btn hidden" style="position: absolute; bottom: 20px; left: 20px; z-index: 100; width: auto; font-size: 0.9rem; padding: 10px 20px;">Finish Game</button>

                        <!-- Players will be dynamically positioned here -->
                        <div id="seats-container"></div>
                    </div>
                </div>

                <!-- Dedicated Sidebar -->
                <aside class="game-sidebar glass-panel">
                    <div class="sidebar-section scoreboard-section">
                        <h3>Scores</h3>
                        <ul id="game-leaderboard" class="mini-leaderboard-list"></ul>
                    </div>

                    <div class="sidebar-section chat-section">
                        <div class="reactions-bar">
                            <button class="btn-emote" data-emote="👍">👍</button>
                            <button class="btn-emote" data-emote="😂">😂</button>
                            <button class="btn-emote" data-emote="😱">😱</button>
                            <button class="btn-emote" data-emote="🚓">🚓</button>
                            <button class="btn-emote" data-emote="💰">💰</button>
                            <button class="btn-emote" data-emote="👑">👑</button>
                        </div>
                        <div id="chat-messages" class="chat-messages">
                            <div class="chat-system-msg">System: Welcome to Thief & Police chat!</div>
                        </div>
                        <form id="chat-form" class="chat-form">
                            <input type="text" id="chat-input" placeholder="Type..." autocomplete="off">
                            <button type="submit" class="btn primary-btn">Send</button>
                        </form>
                    </div>
                </aside>
            </div>
        </section>

        <!-- Game Over Screen -->
        <section id="game-over-screen" class="screen">
            <h2 class="glow-text title">GAME OVER</h2>
            
            <div class="glass-panel results-panel">
                <div class="winner-announcement">
                    <h3 class="glow-text">Winner!</h3>
                    <h1 id="winner-name" class="role-text glow-text" style="color: #4ade80;">...</h1>
                </div>

                <div class="updated-scores">
                    <h3>Final Scores</h3>
                    <ul id="final-leaderboard" class="leaderboard-list">
                        <!-- Scores here -->
                    </ul>
                </div>

                <div class="host-controls">
                    <button id="btn-back-to-lobby" class="btn primary-btn glow-btn">Back to Lobby</button>
                </div>
            </div>
        </section>
        
        <!-- Toast Notifications -->
        <div id="toast-container"></div>
    </div>

    <!-- Socket.io and Client logic -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
